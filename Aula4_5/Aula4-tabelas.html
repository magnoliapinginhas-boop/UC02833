<h1>Tabelas em HTML</h1>

<table>
    <!-- table é o contentor; tr = linha; th =cabeçalho; td = célula de dados-->
    <table>
     <!-- Primeira Linha-->

        <!-- 3 COLUNAS-->
        <th>Nome</th>
        <th>Idade</th>
        <th>Cidade</th>
    </tr>
    <!-- SEGUNDA LINHA-->
    <tr>
        <!-- 3 CÉLULAS -->
        <td>João Silva</td>
        <td>28</td>
        <td>Lisboa</td>
    </tr>
    <tr>
        <!-- 3 CÉLULAS -->
        <td>Maria Santos</td>
        <td>34</td>
        <td>Porto</td>
    </tr>
    <tr>
        <!-- 3 CÉLULAS -->
        <td>Pedro Costa</td>
        <td>25</td>

    </tr>
 </table>

<table>
    <thead>
    
    <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço</th>
        <th>Total</th>
    </tr>
        <td>Laptop</td>
        <td>2</td>
        <td>&euro;899,00</td>

    <tr>
        <td>Mouse</td>

        </tr>
    </tr>
    </thead>
    <tbody>

    </tbody>
    <tfoot>
        <tr>
            <!--colspan une colunas na mesma linha-->
            <!--rowspan une linhas na mesma coluna-->
            <td colspan="3">Total Geral</td>
            <td>&euro;2.262,00</td>
        </tr>
    </tfoot>
</table>
